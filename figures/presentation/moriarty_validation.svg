<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">MORIARTY — environment validation, evidence, and extensions</title><desc id="figure-description">Validation and research-status companion. Judge calibration and premise-prior checks precede generation; consistency, leakage and final inferability determine usable episodes; core inferability determines the scoring mask. Recorded pilot and replication evidence is separated from secondary ablations and implemented confirmatory extensions.</desc><defs><radialGradient id="ambient"><stop stop-color="#183A4A" stop-opacity=".55"/><stop offset="1" stop-color="#08131F" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#08131F" stroke="none"></rect><ellipse cx="1570" cy="70" rx="640" ry="430" fill="url(#ambient)"></ellipse><line x1="60" y1="211" x2="1860" y2="211" stroke="#294055" stroke-width="1"></line><text x="60" y="56" fill="#F0CA81" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">M O R I A R T Y</text><rect x="1550" y="32" width="310" height="32" rx="16" fill="#15283A" stroke="none"></rect><text x="1705" y="54" fill="#F0CA81" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">TECHNICAL COMPANION 2</text><text x="60" y="126" fill="#F1F5F8" font-size="57" font-weight="700" font-family="Arial, Helvetica, sans-serif">Make the hidden state measurable.</text><text x="60" y="176" fill="#A7B8C9" font-size="25" font-weight="400" font-family="Arial, Helvetica, sans-serif">Validate the task, preserve the information boundary, and distinguish reported evidence from extensions.</text><rect x="60" y="240" width="1080" height="468" rx="18" fill="#101F30" stroke="none"></rect><rect x="60" y="240" width="1080" height="4" rx="2" fill="#F0CA81" stroke="none"></rect><text x="84" y="279" fill="#F0CA81" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">01  /  ENVIRONMENT VALIDATION</text><text x="84" y="322" fill="#F1F5F8" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">Ambiguous at the start. Recoverable by the end.</text><rect x="82" y="346" width="1036" height="42" rx="6" fill="#15283A" stroke="none"></rect><text x="98" y="373" fill="#F0CA81" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Prerequisite</text><text x="260" y="373" fill="#F1F5F8" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Calibrate the judge</text><text x="565" y="373" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">≥7/8 correct; perfect CONTRADICTS recall</text><text x="98" y="423" fill="#F0CA81" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Check 0</text><text x="260" y="423" fill="#F1F5F8" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Audit premise priors</text><text x="565" y="423" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Maximum goal pick share ≤0.75; no dead goal</text><rect x="82" y="446" width="1036" height="42" rx="6" fill="#15283A" stroke="none"></rect><text x="98" y="473" fill="#F0CA81" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Check 1</text><text x="260" y="473" fill="#F1F5F8" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Verify goal consistency</text><text x="565" y="473" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Zero CONTRADICTS; ≥40% ADVANCES; valid labels</text><text x="98" y="523" fill="#F0CA81" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Check 2a</text><text x="260" y="523" fill="#F1F5F8" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Limit early leakage</text><text x="565" y="523" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Step-1 accuracy − premise prior ≤0.20</text><rect x="82" y="546" width="1036" height="42" rx="6" fill="#15283A" stroke="none"></rect><text x="98" y="573" fill="#F0CA81" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Check 2b</text><text x="260" y="573" fill="#F1F5F8" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Require final inferability</text><text x="565" y="573" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Final-prefix goal accuracy ≥0.80</text><text x="98" y="623" fill="#F0CA81" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Check 3</text><text x="260" y="623" fill="#F1F5F8" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Set the core scoring mask</text><text x="565" y="623" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Hidden core scored only if accuracy ≥0.60</text><text x="84" y="681" fill="#F0CA81" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Checks 0–2 gate families / episodes. Check 3 controls what can fairly be hidden and scored.</text><rect x="1170" y="240" width="690" height="468" rx="18" fill="#101F30" stroke="none"></rect><rect x="1170" y="240" width="690" height="4" rx="2" fill="#61DFC6" stroke="none"></rect><text x="1194" y="279" fill="#61DFC6" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">02  /  RECORDED EVIDENCE</text><text x="1194" y="322" fill="#F1F5F8" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">What the environment has shown</text><text x="1194" y="385" fill="#61DFC6" font-size="54" font-weight="700" font-family="Arial, Helvetica, sans-serif">23/40</text><text x="1516" y="385" fill="#61DFC6" font-size="54" font-weight="700" font-family="Arial, Helvetica, sans-serif">21/40</text><text x="1194" y="417" fill="#A7B8C9" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">usable in pilot</text><text x="1516" y="417" fill="#A7B8C9" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">usable in replication</text><line x1="1194" y1="438" x2="1836" y2="438" stroke="#294055" stroke-width="1"></line><text x="1194" y="490" fill="#F1F5F8" font-size="40" font-weight="700" font-family="Arial, Helvetica, sans-serif">12</text><text x="1280" y="479" fill="#A7B8C9" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">episodes with wrong collapse</text><text x="1280" y="506" fill="#A7B8C9" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">in both information conditions</text><text x="1194" y="560" fill="#F1F5F8" font-size="34" font-weight="700" font-family="Arial, Helvetica, sans-serif">11/12</text><text x="1312" y="550" fill="#A7B8C9" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">agree on the collapse step;</text><text x="1312" y="577" fill="#A7B8C9" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">all 11 agree on the wrong goal</text><rect x="1194" y="604" width="642" height="76" rx="12" fill="#13312F" stroke="none"></rect><text x="1215" y="656" fill="#61DFC6" font-size="46" font-weight="700" font-family="Arial, Helvetica, sans-serif">5</text><text x="1272" y="650" fill="#F1F5F8" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">clauses pass the strict capture filter</text><rect x="60" y="736" width="600" height="270" rx="18" fill="#101F30" stroke="none"></rect><rect x="60" y="736" width="600" height="4" rx="2" fill="#BAA4F3" stroke="none"></rect><text x="84" y="775" fill="#BAA4F3" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">03  /  SECONDARY EXPERIMENT</text><text x="84" y="818" fill="#F1F5F8" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">Compare observer prompting</text><rect x="84" y="841" width="122" height="32" rx="16" fill="#15283A" stroke="none"></rect><text x="145" y="863" fill="#BAA4F3" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">DIRECT</text><rect x="218" y="841" width="188" height="32" rx="16" fill="#15283A" stroke="none"></rect><text x="312" y="863" fill="#BAA4F3" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">CoT-MATCHED</text><rect x="418" y="841" width="216" height="32" rx="16" fill="#15283A" stroke="none"></rect><text x="526" y="863" fill="#BAA4F3" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">LATENT-FIRST</text><text x="84" y="910" fill="#F1F5F8" font-size="22" font-weight="400" font-family="Arial, Helvetica, sans-serif">Level 1: character cores visible</text><text x="84" y="947" fill="#F1F5F8" font-size="22" font-weight="400" font-family="Arial, Helvetica, sans-serif">Level 2: one visible; others inferred</text><text x="84" y="981" fill="#A7B8C9" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Same environment; separate from the single-token probe.</text><rect x="688" y="736" width="1172" height="270" rx="18" fill="#101F30" stroke="none"></rect><rect x="688" y="736" width="1172" height="4" rx="2" fill="#7FB7FA" stroke="none"></rect><text x="712" y="775" fill="#7FB7FA" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">04  /  IMPLEMENTED CONFIRMATORY EXTENSIONS</text><text x="712" y="818" fill="#F1F5F8" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">Code + preregistration; outcomes not established here</text><line x1="1080" y1="837" x2="1080" y2="982" stroke="#294055" stroke-width="1"></line><line x1="1454" y1="837" x2="1454" y2="982" stroke="#294055" stroke-width="1"></line><text x="712" y="850" fill="#7FB7FA" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">TRANSFER</text><text x="712" y="884" fill="#F1F5F8" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">16 new families × 4 goals</text><text x="712" y="913" fill="#F1F5F8" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Qwen2.5-7B full-vocab probe</text><text x="712" y="942" fill="#F1F5F8" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">GPT-4o-mini cross-model check</text><text x="1104" y="850" fill="#7FB7FA" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">NEUTRAL REPLACEMENT</text><text x="1104" y="884" fill="#F1F5F8" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Replace the triggering clause</text><text x="1104" y="913" fill="#F1F5F8" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">Recovery = (pfull − preplaced)</text><text x="1104" y="942" fill="#F1F5F8" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">                     / (pfull − pdeleted)</text><text x="1478" y="850" fill="#7FB7FA" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">LAYER READOUT</text><text x="1478" y="884" fill="#F1F5F8" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Logit lens at answer position</text><text x="1478" y="913" fill="#F1F5F8" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">With clause vs without clause</text><text x="1478" y="942" fill="#F1F5F8" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Mean wrong-goal mass, upper layers</text><text x="712" y="983" fill="#F0CA81" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Operational, candidate-conditioned measurements; internal beliefs and causal path dependence remain open questions.</text><line x1="60" y1="1024" x2="1860" y2="1024" stroke="#294055" stroke-width="1"></line><text x="60" y="1055" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Molood Arman  ·  github.com/moloodbahar/Moriarty</text><text x="1860" y="1055" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">VALIDATION, EVIDENCE &amp; RESEARCH STATUS   /   03</text></svg>