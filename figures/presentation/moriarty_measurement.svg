<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">MORIARTY — the probability probe and clause-level capture</title><desc id="figure-description">Technical companion explaining log-probability extraction, four cyclic label rotations, semantic remapping, trajectory statistics and event thresholds, the naive and Agent-B-information conditions, and the strict addition/deletion capture filter.</desc><defs><radialGradient id="ambient"><stop stop-color="#183A4A" stop-opacity=".55"/><stop offset="1" stop-color="#08131F" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#08131F" stroke="none"></rect><ellipse cx="1570" cy="70" rx="640" ry="430" fill="url(#ambient)"></ellipse><line x1="60" y1="211" x2="1860" y2="211" stroke="#294055" stroke-width="1"></line><text x="60" y="56" fill="#F0CA81" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">M O R I A R T Y</text><rect x="1550" y="32" width="310" height="32" rx="16" fill="#15283A" stroke="none"></rect><text x="1705" y="54" fill="#7FB7FA" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">TECHNICAL COMPANION 1</text><text x="60" y="126" fill="#F1F5F8" font-size="57" font-weight="700" font-family="Arial, Helvetica, sans-serif">Inside the measurement instrument.</text><text x="60" y="176" fill="#A7B8C9" font-size="25" font-weight="400" font-family="Arial, Helvetica, sans-serif">Probe four named goals at every story prefix, then repeat the same measurement after a clause edit.</text><rect x="60" y="240" width="800" height="450" rx="18" fill="#101F30" stroke="none"></rect><rect x="60" y="240" width="800" height="4" rx="2" fill="#7FB7FA" stroke="none"></rect><text x="84" y="279" fill="#7FB7FA" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">01  /  PROBABILITY READOUT</text><text x="84" y="322" fill="#F1F5F8" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">From answer tokens to semantic goals</text><text x="84" y="360" fill="#7FB7FA" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">FOUR CYCLIC LABEL ROTATIONS</text><text x="173" y="398" fill="#A7B8C9" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">A</text><text x="238" y="398" fill="#A7B8C9" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">B</text><text x="303" y="398" fill="#A7B8C9" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">C</text><text x="368" y="398" fill="#A7B8C9" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">D</text><text x="110" y="438" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">r0</text><rect x="148" y="410" width="50" height="33" rx="6" fill="#15283A" stroke="#FF8C85"></rect><text x="173" y="433" fill="#FF8C85" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G1</text><rect x="213" y="410" width="50" height="33" rx="6" fill="#15283A" stroke="#BAA4F3"></rect><text x="238" y="433" fill="#BAA4F3" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G2</text><rect x="278" y="410" width="50" height="33" rx="6" fill="#15283A" stroke="#61DFC6"></rect><text x="303" y="433" fill="#61DFC6" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G3</text><rect x="343" y="410" width="50" height="33" rx="6" fill="#15283A" stroke="#7FB7FA"></rect><text x="368" y="433" fill="#7FB7FA" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G4</text><text x="110" y="481" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">r1</text><rect x="148" y="453" width="50" height="33" rx="6" fill="#15283A" stroke="#BAA4F3"></rect><text x="173" y="476" fill="#BAA4F3" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G2</text><rect x="213" y="453" width="50" height="33" rx="6" fill="#15283A" stroke="#61DFC6"></rect><text x="238" y="476" fill="#61DFC6" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G3</text><rect x="278" y="453" width="50" height="33" rx="6" fill="#15283A" stroke="#7FB7FA"></rect><text x="303" y="476" fill="#7FB7FA" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G4</text><rect x="343" y="453" width="50" height="33" rx="6" fill="#15283A" stroke="#FF8C85"></rect><text x="368" y="476" fill="#FF8C85" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G1</text><text x="110" y="524" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">r2</text><rect x="148" y="496" width="50" height="33" rx="6" fill="#15283A" stroke="#61DFC6"></rect><text x="173" y="519" fill="#61DFC6" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G3</text><rect x="213" y="496" width="50" height="33" rx="6" fill="#15283A" stroke="#7FB7FA"></rect><text x="238" y="519" fill="#7FB7FA" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G4</text><rect x="278" y="496" width="50" height="33" rx="6" fill="#15283A" stroke="#FF8C85"></rect><text x="303" y="519" fill="#FF8C85" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G1</text><rect x="343" y="496" width="50" height="33" rx="6" fill="#15283A" stroke="#BAA4F3"></rect><text x="368" y="519" fill="#BAA4F3" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G2</text><text x="110" y="567" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">r3</text><rect x="148" y="539" width="50" height="33" rx="6" fill="#15283A" stroke="#7FB7FA"></rect><text x="173" y="562" fill="#7FB7FA" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G4</text><rect x="213" y="539" width="50" height="33" rx="6" fill="#15283A" stroke="#FF8C85"></rect><text x="238" y="562" fill="#FF8C85" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G1</text><rect x="278" y="539" width="50" height="33" rx="6" fill="#15283A" stroke="#BAA4F3"></rect><text x="303" y="562" fill="#BAA4F3" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G2</text><rect x="343" y="539" width="50" height="33" rx="6" fill="#15283A" stroke="#61DFC6"></rect><text x="368" y="562" fill="#61DFC6" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">G3</text><line x1="420" y1="493" x2="462" y2="493" stroke="#7FB7FA" stroke-width="2.2"></line><path d="M 455 486 L 470 493 L 455 500" stroke="#7FB7FA" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="498" y="405" fill="#F1F5F8" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">1  Extract label mass</text><text x="498" y="436" fill="#7FB7FA" font-size="22" font-weight="400" font-family="Arial, Helvetica, sans-serif">L(ℓ) = Σ exp(logprob(token))</text><text x="498" y="462" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Sum tokens mapped to label ℓ.</text><text x="498" y="502" fill="#F1F5F8" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">2  Normalize over A–D</text><text x="498" y="533" fill="#7FB7FA" font-size="23" font-weight="400" font-family="Arial, Helvetica, sans-serif">pʳₜ(g) = L(ℓᵣ(g)) / Σℓ L(ℓ)</text><text x="498" y="573" fill="#F1F5F8" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">3  Undo rotations; average</text><text x="498" y="606" fill="#61DFC6" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">pₜ(g) = ¼ Σᵣ pʳₜ(g)</text><line x1="84" y1="620" x2="836" y2="620" stroke="#294055" stroke-width="1"></line><text x="84" y="650" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">gpt-4o-mini · 1 output token · temperature 0 · top_logprobs = 20</text><text x="84" y="678" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Record label coverage, permutation spread, and semantic argmax agreement.</text><rect x="886" y="240" width="974" height="450" rx="18" fill="#101F30" stroke="none"></rect><rect x="886" y="240" width="974" height="4" rx="2" fill="#61DFC6" stroke="none"></rect><text x="910" y="279" fill="#61DFC6" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">02  /  TRAJECTORY STATISTICS</text><text x="910" y="322" fill="#F1F5F8" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">Separate uncertainty, capture, and recovery</text><text x="911" y="363" fill="#61DFC6" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">qₜ = pₜ(g*)</text><text x="1835" y="363" fill="#A7B8C9" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">true-goal probability</text><text x="911" y="402" fill="#7FB7FA" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Hₜ = −½ Σg pₜ(g) log₂ pₜ(g)</text><text x="1835" y="402" fill="#A7B8C9" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">normalized entropy</text><text x="911" y="441" fill="#FF8C85" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Wₜ = maxg≠g* pₜ(g)</text><text x="1835" y="441" fill="#A7B8C9" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">dominant wrong probability</text><text x="911" y="480" fill="#BAA4F3" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">JSDₜ = ½ KL(pₜ₋₁ ‖ mₜ) + ½ KL(pₜ ‖ mₜ)</text><text x="1835" y="480" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">mₜ = (pₜ₋₁ + pₜ)/2</text><line x1="911" y1="498" x2="1835" y2="498" stroke="#294055" stroke-width="1"></line><text x="911" y="529" fill="#FF8C85" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Wrong collapse</text><text x="1162" y="529" fill="#F1F5F8" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">ΔW &gt; 0, Δq &lt; 0, ΔH &lt; 0; wrong argmax</text><text x="911" y="568" fill="#FF8C85" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Committed wrong</text><text x="1162" y="568" fill="#F1F5F8" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">q ≤ 0.20, W ≥ 0.70, H ≤ 0.50</text><text x="911" y="607" fill="#61DFC6" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">Resolution</text><text x="1162" y="607" fill="#F1F5F8" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">Δq ≥ 0.30, ΔH &lt; 0; true argmax</text><text x="911" y="650" fill="#A7B8C9" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Collapse / resolution: ≥3/4 argmax agreement; retain strongest eligible gain.</text><text x="911" y="678" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Also track: max H; max JSD; entropy rise ≥0.15; true→wrong entry; persistence.</text><rect x="60" y="718" width="800" height="285" rx="18" fill="#101F30" stroke="none"></rect><rect x="60" y="718" width="800" height="4" rx="2" fill="#F0CA81" stroke="none"></rect><text x="84" y="757" fill="#F0CA81" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">03  /  OBSERVER INFORMATION</text><text x="84" y="800" fill="#F1F5F8" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">Two views of the same unfolding story</text><rect x="84" y="828" width="352" height="95" rx="12" fill="#15283A" stroke="none"></rect><rect x="460" y="828" width="376" height="95" rx="12" fill="#15283A" stroke="none"></rect><text x="104" y="855" fill="#F0CA81" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">NAIVE</text><text x="104" y="885" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Story prefix + candidate goals</text><text x="104" y="910" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">No character cores shown</text><text x="480" y="855" fill="#F0CA81" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">B-INFORMATION</text><text x="480" y="885" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Same inputs + one visible core</text><text x="480" y="910" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Other two cores marked unknown</text><text x="84" y="956" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">The least-inferable core is revealed; hidden cores are scored only if recoverable.</text><text x="84" y="986" fill="#F0CA81" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Each prefix is a fresh direct probe; B’s CoT / Latent-First trace is not replayed.</text><rect x="886" y="718" width="974" height="285" rx="18" fill="#101F30" stroke="none"></rect><rect x="886" y="718" width="974" height="4" rx="2" fill="#FF8C85" stroke="none"></rect><text x="910" y="757" fill="#FF8C85" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">04  /  CLAUSE INTERVENTIONS</text><text x="910" y="800" fill="#F1F5F8" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">Track the same specific wrong goal, g⁻</text><text x="911" y="855" fill="#FF8C85" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">ADD</text><text x="1000" y="855" fill="#F1F5F8" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">p(g⁻ | prefix + c₁…cⱼ) − p(g⁻ | prefix + c₁…cⱼ₋₁) ≥ 0.15</text><text x="911" y="897" fill="#61DFC6" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">DELETE</text><text x="1020" y="897" fill="#F1F5F8" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">p(g⁻ | full step) − p(g⁻ | full step without cⱼ) ≥ 0.10</text><line x1="911" y1="916" x2="1835" y2="916" stroke="#294055" stroke-width="1"></line><text x="911" y="947" fill="#F1F5F8" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif">Same collapse step + wrong goal + clause in both information conditions.</text><text x="911" y="978" fill="#A7B8C9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Addition and deletion must select the same clause within each; agreement ≥3/4.</text><line x1="60" y1="1024" x2="1860" y2="1024" stroke="#294055" stroke-width="1"></line><text x="60" y="1055" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Molood Arman  ·  github.com/moloodbahar/Moriarty</text><text x="1860" y="1055" fill="#A7B8C9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">PROBE, METRICS &amp; INTERVENTIONS   /   02</text></svg>